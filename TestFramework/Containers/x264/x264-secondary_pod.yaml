apiVersion: v1
kind: Pod
metadata:
  name: x264-secondary
  labels:
    name: x264-secondary-server
spec:
  # Run on the harvest worker (labelled by the dsb_k8s_perf harvest profile),
  # tolerating the dedicated=special taint used to keep DSB pods off it
  nodeSelector:
    podtype: harvest
  tolerations:
    - key: dedicated
      operator: Equal
      value: special
      effect: NoSchedule
  containers:
    - name: x264
      image: asarma31/x264-secondary:latest
      imagePullPolicy: Never
      ports:
        - name: x264 
          containerPort: 20000
          protocol: TCP
      volumeMounts:
        - name: x264-input-vol
          mountPath: /mnt/data/inputs
  volumes:
    - name: x264-input-vol
      hostPath:
        path: /mnt/extra/x264.inputs
