apiVersion: v1
kind: Pod
metadata:
  name: cpubully-secondary
  labels:
    name: cpubully-secondary-server
spec:
  # Run on the harvest worker (labelled by the dsb_k8s_perf harvest profile),
  # tolerating the dedicated=special taint used to keep DSB pods off it
  nodeSelector:
    podtype: harvest
  tolerations:
    - key: dedicated
      operator: Equal
      value: special
      effect: NoSchedule
  containers:
    - name: cpubully
      image: asarma31/cpubully:latest
      imagePullPolicy: Never
      ports:
        - name: cpubully-two
          containerPort: 20000
          protocol: TCP
