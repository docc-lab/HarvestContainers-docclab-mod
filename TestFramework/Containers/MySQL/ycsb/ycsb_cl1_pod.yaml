apiVersion: v1
kind: Pod
metadata:
  name: ycsb-cl1
  labels:
    name: ycsb-cl1
spec:
  # Run on the harvest worker (labelled by the dsb_k8s_perf harvest profile),
  # tolerating the dedicated=special taint used to keep DSB pods off it
  nodeSelector:
    podtype: harvest
  tolerations:
    - key: dedicated
      operator: Equal
      value: special
      effect: NoSchedule
  containers:
    - name: ycsb
      image: asarma31/ycsb:latest
      imagePullPolicy: Never
      ports:
        - name: ycsb
          containerPort: 20002
          protocol: TCP
      env:
        - name: YCSB_THREADS
          value: "8"
        - name: YCSB_CORE_RANGE
          value: "1-31"
      volumeMounts:
        - name: ycsb-results
          mountPath: /app/results
        # db.properties baked into the image hardcodes the MySQL host;
        # override it from the ycsb-db-properties ConfigMap (setup_workload.sh)
        - name: ycsb-db-properties
          mountPath: /app/ycsb-0.17.0/db.properties
          subPath: db.properties
  volumes:
    - name: ycsb-db-properties
      configMap:
        name: ycsb-db-properties
    - name: ycsb-results
      hostPath:
        path: /mnt/extra/results/mysql
        type: DirectoryOrCreate
