apiVersion: v1
kind: Pod
metadata:
  name: ycsb
  labels:
    name: ycsb
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
    # Pin to node-0 (clabsvr): results are written to its /mnt/extra via hostPath
    kubernetes.io/hostname: node-0
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  containers:
    - name: ycsb
      image: asarma31/ycsb:latest
      imagePullPolicy: Never
      ports:
        - name: ycsb
          containerPort: 20002
          protocol: TCP
      env:
        - name: YCSB_THREADS
          value: "8"
        - name: YCSB_CORE_RANGE
          value: "1-31"
      volumeMounts:
        - name: ycsb-results
          mountPath: /app/results
        # db.properties baked into the image hardcodes the MySQL host;
        # override it from the ycsb-db-properties ConfigMap (setup_workload.sh)
        - name: ycsb-db-properties
          mountPath: /app/ycsb-0.17.0/db.properties
          subPath: db.properties
  volumes:
    - name: ycsb-db-properties
      configMap:
        name: ycsb-db-properties
    - name: ycsb-results
      hostPath:
        path: /mnt/extra/results/mysql
        type: DirectoryOrCreate