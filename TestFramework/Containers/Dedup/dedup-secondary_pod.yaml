apiVersion: v1
kind: Pod
metadata:
  name: dedup-secondary
  labels:
    name: dedup-secondary-server
spec:
  # Run on the harvest worker (labelled by the dsb_k8s_perf harvest profile),
  # tolerating the dedicated=special taint used to keep DSB pods off it
  nodeSelector:
    podtype: harvest
  tolerations:
    - key: dedicated
      operator: Equal
      value: special
      effect: NoSchedule
  containers:
    - name: dedup
      image: asarma31/dedup-secondary:latest
      imagePullPolicy: Never
      ports:
        - name: dedup 
          containerPort: 20000
          protocol: TCP
      volumeMounts:
        - name: dedup-input-vol
          mountPath: /mnt/extra/inputs
  volumes:
    - name: dedup-input-vol
      hostPath:
        path: /mnt/extra/dedup.inputs
