apiVersion: v1
kind: Pod
metadata:
  name: memcached-primary
  labels:
    name: memcached-server
spec:
  # Run on the harvest worker (labelled by the dsb_k8s_perf harvest profile),
  # tolerating the dedicated=special taint used to keep DSB pods off it
  nodeSelector:
    podtype: harvest
  tolerations:
    - key: dedicated
      operator: Equal
      value: special
      effect: NoSchedule
  containers:
    - name: memcached-primary
      image: asarma31/memcached-primary:latest
      imagePullPolicy: Never
      ports:
        - name: memcached
          containerPort: 11212
          protocol: TCP
      env:
        - name: MEMCACHED_THREADS
          value: "16"
        - name: MEMCACHED_CONNS
          value: "32768"
        - name: MEMCACHED_RAM
          value: "16384"
